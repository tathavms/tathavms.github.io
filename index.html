document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  body { margin: 0; }\n  a { color: inherit; text-decoration: none; }\n  a:hover { opacity: 0.72; }\n  ::selection { background: oklch(0.55 0.09 200 / 0.25); }\n  @media (max-width: 900px) {\n    .g-2 { grid-template-columns: 1fr !important; }\n  }\n  @media (max-width: 760px) {\n    .pg { padding: 44px 20px 72px !important; }\n    .g-hero { grid-template-columns: 1fr !important; gap: 28px !important; }\n    .r-stack, .r-exp { grid-template-columns: 1fr !important; gap: 6px !important; }\n    .hname { white-space: normal !important; font-size: 32px !important; }\n    .tgl { position: static !important; display: flex !important; margin: 0 0 22px auto !important; }\n  }\n<\u002Fstyle>\n<script src=\"75f1d433-ab8c-4e6a-b4a3-385df5e504ab\"><\u002Fscript>\n<\u002Fhelmet>\n\n<sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed; inset:0; z-index:1000; background:oklch(0.15 0.01 260 / 0.55); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:32px; font-family:'IBM Plex Sans',system-ui,sans-serif;\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"max-width:600px; width:100%; max-height:86vh; overflow:auto; background:var(--panel, oklch(0.99 0.004 90)); color:var(--text, oklch(0.2 0.01 260)); border-radius:20px; padding:40px; box-shadow:0 30px 80px oklch(0.1 0.02 260 / 0.4); position:relative;\">\n      <button sc-camel-on-click=\"{{ closeModal }}\" style=\"position:absolute; top:20px; right:20px; width:36px; height:36px; border-radius:50%; border:1px solid var(--border, oklch(0.88 0.005 260)); background:transparent; cursor:pointer; font-size:18px; color:var(--body, oklch(0.4 0.01 260)); line-height:1;\">×<\u002Fbutton>\n      <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; ge-slot id=\"portrait\" src=\"2685d5d8-6a03-4497-bbe7-0192d049dc99\" shape=\"rounded\" radius=\"14\" fit=\"cover\" placeholder=\"Drop your photo\" style=\"width:104px; height:104px;\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <h1 class=\"hname\" style=\"margin:0; font-size:44px; line-height:1.05; font-weight:700; letter-spacing:-0.02em; white-space:nowrap;\">Tathagata Banerjee<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"margin:16px 0 0; font-family:'IBM Plex Mono',monospace; font-size:19px; line-height:1.4; color:{{ accent }};\">Software Engineer · NLP &amp; Agentic AI · Quantum Computing<\u002Fdiv>\n        <div style=\"margin:8px 0 0; font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--muted2, oklch(0.5 0.02 260));\">Bangalore, Karnataka, India<\u002Fdiv>\n        <div style=\"display:flex; gap:12px; margin-top:28px; font-family:'IBM Plex Mono',monospace;\">\n          <a href=\"{{ resumeUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:13px 22px; border-radius:8px; background:var(--btnBg, oklch(0.2 0.006 260)); color:var(--btnText, oklch(0.95 0.01 200)); font-weight:500; font-size:14px;\">View Resume<\u002Fa>\n          <a href=\"{{ resumeUrl }}\" download=\"\" style=\"padding:13px 22px; border-radius:8px; border:1px solid var(--border, oklch(0.82 0.01 260)); color:var(--text, oklch(0.2 0.006 260)); font-weight:500; font-size:14px;\">Download Resume<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:26px; border:1px solid var(--border, oklch(0.88 0.008 260)); border-radius:14px; background:var(--panel, oklch(0.99 0.003 250));\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:18px;\">// contact<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:13px; font-family:'IBM Plex Mono',monospace; font-size:13.5px; line-height:1.4;\">\n          <div>\n            <div style=\"color:var(--muted2, oklch(0.5 0.02 260));\"><b>Email:<\u002Fb><\u002Fdiv>\n            <a href=\"mailto:tathavms@gmail.com\" style=\"color:var(--body, oklch(0.28 0.006 260)); text-decoration:underline; word-break:break-all;\">tathavms@gmail.com<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"color:var(--muted2, oklch(0.5 0.02 260));\"><b>Phone:<\u002Fb><\u002Fdiv>\n            <a href=\"tel:+918777081148\" style=\"color:var(--body, oklch(0.28 0.006 260)); text-decoration:underline;\">+91 87770 81148<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"color:var(--muted2, oklch(0.5 0.02 260));\"><b>LinkedIn:<\u002Fb><\u002Fdiv>\n            <a href=\"https://www.linkedin.com/in/tatha-banerjee/\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--body, oklch(0.28 0.006 260)); text-decoration:underline; word-break:break-all;\">in/tatha-banerjee<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"color:var(--muted2, oklch(0.5 0.02 260));\"><b>GitHub:<\u002Fb><\u002Fdiv>\n            <a href=\"https://github.com/tathavms\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--body, oklch(0.28 0.006 260)); text-decoration:underline; word-break:break-all;\">github.com/tathavms<\u002Fa>\n          <\u002Fdiv>\n          <div>\n            <div style=\"color:var(--muted2, oklch(0.5 0.02 260));\"><b>Website:<\u002Fb><\u002Fdiv>\n            <a href=\"https://tathavms.github.io\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--body, oklch(0.28 0.006 260)); text-decoration:underline; word-break:break-all;\">tathavms.github.io<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ABOUT -->\n    <div style=\"margin-top:72px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:18px;\">// about<\u002Fdiv>\n      <p style=\"margin:0; font-size:18px; line-height:1.65; max-width:760px; color:var(--body, oklch(0.3 0.006 260));\">NLP and agentic-AI engineer with hands-on, end-to-end ML deployments: a transformer-based ticket router, a sentiment-classification API, and an agentic RAG system over quantum-NLP research papers, each with its own CI/CD and cloud setup. Backed by 8 years of software engineering in backend development and test automation at Dell Technologies and Accenture, including applied ML and NLP. Completed a research internship at CDAC building an original hybrid quantum-classical architecture for text classification with lambeq and PennyLane, with a survey paper accepted for poster presentation at an IEEE conference at IIT Patna.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- STACK -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:22px;\">// stack<\u002Fdiv>\n      <sc-for list=\"{{ skills }}\" as=\"g\" hint-placeholder-count=\"7\">\n        <div class=\"r-stack\" style=\"display:grid; grid-template-columns:210px 1fr; gap:20px; padding:16px 0; border-top:1px solid var(--borderSoft, oklch(0.9 0.006 260)); align-items:baseline;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted2, oklch(0.45 0.02 260));\">{{ g.label }}<\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n            <sc-for list=\"{{ g.chips }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:5px 11px; border-radius:6px; background:var(--chipBg, oklch(0.94 0.006 260)); color:var(--chipText, oklch(0.3 0.006 260));\">{{ c }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- PROJECTS -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:22px;\">// projects<\u002Fdiv>\n      <div class=\"g-2\" style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px;\">\n        <sc-for list=\"{{ projects }}\" as=\"p\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ p.open }}\" style=\"cursor:pointer; padding:26px; border:1px solid var(--border, oklch(0.86 0.008 260)); border-radius:12px; background:var(--panel, oklch(0.99 0.003 250)); display:flex; flex-direction:column;\" style-hover=\"border-color:oklch(0.55 0.09 200); box-shadow:0 8px 24px oklch(0.4 0.05 200 / 0.12);\">\n            <div style=\"display:flex; justify-content:space-between; align-items:center; gap:10px;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:{{ accent }};\">{{ p.tag }}<\u002Fdiv>\n              <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--chipBg, oklch(0.94 0.006 260)); color:var(--muted2, oklch(0.5 0.02 260));\">{{ p.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:21px; font-weight:600; margin:12px 0 10px; line-height:1.2; color:var(--text, oklch(0.2 0.006 260));\">{{ p.name }}<\u002Fdiv>\n            <div style=\"font-size:14px; line-height:1.55; color:var(--body, oklch(0.42 0.006 260)); flex:1;\">{{ p.blurb }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--projText, oklch(0.5 0.01 260)); margin-top:16px;\">click to open →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- EXPERIENCE -->\n    <div style=\"margin-top:64px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:26px;\">// experience<\u002Fdiv>\n      <sc-for list=\"{{ experience }}\" as=\"e\" hint-placeholder-count=\"5\">\n        <div class=\"r-exp\" style=\"display:grid; grid-template-columns:200px 1fr; gap:24px; padding:24px 0; border-top:1px solid var(--borderSoft, oklch(0.9 0.006 260));\">\n          <div>\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted2, oklch(0.5 0.02 260));\">{{ e.period }}<\u002Fdiv>\n            <div style=\"font-size:15px; font-weight:600; margin-top:6px; color:var(--text, oklch(0.25 0.006 260));\">{{ e.company }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:18px; font-weight:600; color:var(--text, oklch(0.2 0.006 260));\">{{ e.role }}<\u002Fdiv>\n            <ul style=\"margin:12px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:9px;\">\n              <sc-for list=\"{{ e.bullets }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <li style=\"display:grid; grid-template-columns:16px 1fr; gap:10px; font-size:14.5px; line-height:1.6; color:var(--body, oklch(0.36 0.006 260));\">\n                  <span style=\"color:{{ accent }}; font-family:'IBM Plex Mono',monospace;\">▹<\u002Fspan>\n                  <span>{{ b }}<\u002Fspan>\n                <\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- EDUCATION + CERTIFICATIONS -->\n    <div class=\"g-2\" style=\"margin-top:64px; display:grid; grid-template-columns:1fr 1fr; gap:48px;\">\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:22px;\">// education<\u002Fdiv>\n        <sc-for list=\"{{ education }}\" as=\"ed\" hint-placeholder-count=\"2\">\n          <div style=\"padding:14px 0; border-top:1px solid var(--borderSoft, oklch(0.9 0.006 260));\">\n            <div style=\"font-size:16px; font-weight:600; color:var(--text, oklch(0.22 0.006 260)); line-height:1.4;\">{{ ed.title }}<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted2, oklch(0.5 0.02 260)); margin-top:5px;\">{{ ed.meta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"margin-top:34px;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:18px;\">// research<\u002Fdiv>\n          <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:var(--body, oklch(0.36 0.006 260));\">Survey paper (work in progress): <i>\"A Survey of Quantum Natural Language Processing, From Foundations to Near Term Applications.\"<\u002Fi> Accepted for poster presentation at an IEEE conference at IIT Patna.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:0.12em; text-transform:uppercase; color:{{ accent }}; margin-bottom:22px;\">// certifications<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column;\">\n          <sc-for list=\"{{ certifications }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid; grid-template-columns:1fr auto; gap:14px; padding:11px 0; border-top:1px solid var(--borderSoft, oklch(0.9 0.006 260)); align-items:baseline;\">\n              <div style=\"font-size:14px; line-height:1.45; color:var(--body, oklch(0.32 0.006 260));\">{{ c.name }}<\u002Fdiv>\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted2, oklch(0.5 0.02 260)); white-space:nowrap;\">{{ c.meta }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;100%&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;oklch(0.5 0.09 200)&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;oklch(0.5 0.09 200)&quot;,&quot;oklch(0.55 0.12 155)&quot;,&quot;oklch(0.55 0.15 45)&quot;,&quot;oklch(0.5 0.15 280)&quot;],&quot;section&quot;:&quot;Theme&quot;},&quot;resumeUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;resume/Tathagata_Banerjee_Resume.pdf&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { activeId: null, dark: false };\n\n  get baseProjects() {\n    return [\n      {\n        id: 'qagent',\n        name: 'QNLP Research Agent',\n        tag: 'RAG · LangGraph',\n        status: 'In progress',\n        blurb: 'A RAG agent that answers questions about quantum NLP papers with citations, and turns sentences into lambeq diagrams and quantum circuits.',\n        desc: 'A question answering agent that reads quantum NLP research papers and answers questions about them. Every answer comes with a citation to the paper and section it came from. It can also take any English sentence and build a lambeq string diagram and an IQP quantum circuit from it.',\n        highlights: [\n          'Retrieval uses BAAI/bge-m3 embeddings stored in Qdrant, with MMR search, multi query retrieval and a cross encoder reranker on top.',\n          'PDF parsing keeps LaTeX blocks and tables in one piece, so the text splitter does not cut them in the middle.',\n          'The agent runs on LangGraph and decides on its own whether to use the retrieval tool or one of three lambeq based tools.',\n          'I built a 26 question test set across 3 papers to check it. It caught a Unicode bug that was hiding about 11 points of recall, and it showed that the model with the best keyword score was making up citations, so I moved to a more reliable model.',\n          'I traced a 55 minute stall to a bad function call coming from the model provider, and a tool routing mistake to two tools having the same description.'\n        ],\n        noLinks: true,\n        linkNote: 'In progress. Not deployed yet.'\n      },\n      {\n        id: 'hybrid',\n        name: 'Hybrid Quantum-Classical NLP',\n        tag: 'QNLP · PyTorch',\n        status: 'Research · CDAC',\n        blurb: 'An original hybrid model that turns sentences into small quantum circuits and classifies their emotion with an LSTM.',\n        desc: 'My main research project during the CDAC internship. I built a model that turns English sentences into small quantum circuits and then classifies their emotion with an LSTM on top. This is early stage research. The goal was not to beat classical models but to get a working hybrid pipeline and to understand where and why it breaks.',\n        highlights: [\n          'The model reached 81 to 100 percent accuracy on binary classification, with gradients flowing all the way back to the quantum circuit parameters through the parameter shift rule.',\n          'The pipeline turned sentences into quantum circuits using CCG parsing, DisCoCat diagrams and an IQP ansatz. It ran over 1,500 circuits with close to 3,900 quantum parameters, tested across 4 datasets and 2 quantum backends.',\n          'On the multi class runs the headline accuracy looked fine but was really at chance level. I found that a plain accuracy number was hiding near zero recall on most emotion classes, and switched to per class precision, recall and F1 to show that clearly.',\n          'I traced a later failure to two causes. A lot of data was being dropped across the pipeline, and a small tensor mistake was cutting off the gradient to the quantum parameters. I built a gradient check tool to catch this kind of issue.',\n          'Caching the parsed diagrams and compiled circuits cut experiment time from about 2 hours down to a few seconds.'\n        ],\n        noLinks: true,\n        linkNote: 'Research project. Code available on request.'\n      },\n      {\n        id: 'ticket',\n        name: 'ML-Based Support Ticket Router',\n        tag: 'NLP · Classification',\n        status: 'Live',\n        blurb: 'A DistilBERT ticket router with spam screening that sorts tickets into four teams, or turns them away when they do not fit.',\n        desc: 'A personal project built end to end with open source tools. It takes an incoming ticket, screens it for spam, and sorts real tickets into one of four teams: Sales, Support, Billing or Customer Service. Tickets that do not match any team are turned away instead of being forced into one. It is my own rebuild of a ticket routing idea I first saw while testing a system at Dell in 2020, built fresh from scratch.',\n        highlights: [\n          'I fine tuned DistilBERT for the 4 way routing and put a pretrained spam classifier in front of it. Unknown tickets are rejected using both a confidence check and an entropy check, since the two catch different problems.',\n          'It gets 78.2 percent accuracy and 0.78 weighted F1 on a held out test set of about 20,000 tickets, where a random guess would be 25 percent.',\n          'I found and fixed a data leak where duplicated training examples were landing in both the train and test sets. I also replaced a spam model that worked on corporate email but failed on real support tickets.',\n          'It runs on one free tier EC2 instance next to a second app, at no monthly cost. The model weights sit outside the Docker image in S3 and are mounted at runtime, so updating the model needs no rebuild.',\n          'This is a portfolio deployment, not a production system. There is no real user traffic and no monitoring.'\n        ],\n        source: 'https://github.com/tathavms/lead_routing',\n        demo: 'http://13.48.162.241/lead-routing/'\n      },\n      {\n        id: 'tweet',\n        name: 'Tweet Sentiment Classifier',\n        tag: 'NLP · Sentiment',\n        status: 'Live',\n        blurb: 'A sentiment web app and API that runs DistilBERT on a small CPU only server.',\n        desc: 'An end to end web app that labels short text as positive or negative. You can use the web form or the JSON API, and it returns a label with a confidence score. Most of the effort here went into the engineering around the model, not just the model itself.',\n        highlights: [\n          'I fine tuned DistilBERT so it runs on CPU only on a 1 GB instance.',\n          'The training labels came from a weak supervision pipeline using VADER, so the 90.8 percent validation accuracy is measured against those labels and not against human labelled data.',\n          'The model weights are kept out of the Docker image and stored in S3, so I can update the model without rebuilding the app.',\n          'Once loaded it answers in about 13 milliseconds, and it has had no out of memory crashes while sharing a 1 GB instance with another app.'\n        ],\n        source: 'https://github.com/tathavms/tweet_sentiment_analysis',\n        demo: 'http://13.48.162.241/twitter/'\n      },\n      {\n        id: 'autotag',\n        name: 'NLP Auto-Tagging & FAQ Chatbot',\n        tag: 'NLP · POC',\n        status: 'Planned',\n        blurb: 'A small proof of concept that suggests tags for digital assets and adds a simple FAQ chatbot on the same page.',\n        desc: 'A small proof of concept I am building on my own. It suggests tags for digital assets from their title and description, and it adds a simple FAQ chatbot on the same page.',\n        highlights: [\n          'Tag suggestions come from KeyBERT keyphrase extraction combined with embedding similarity against a list of tag categories.',\n          'It is served through a FastAPI form page, following the same pattern as my other deployments.',\n          'A lightweight FAQ chatbot sits on the same page.'\n        ],\n        noLinks: true,\n        linkNote: 'Planned. Not built yet.'\n      }\n    ];\n  }\n\n  get skillGroups() {\n    return [\n      { label: 'NLP & Transformers', chips: ['HuggingFace Transformers', 'Datasets', 'Accelerate', 'Evaluate', 'DistilBERT fine-tuning', 'weak supervision labelling (VADER)', 'sentence-transformers', 'cross-encoder reranking'] },\n      { label: 'LLM & Agentic Systems', chips: ['LangChain (LCEL)', 'LangGraph', 'StateGraph', 'ToolNode', 'RAG pipelines', 'multi-query retrieval', 'Qdrant', 'Groq', 'OpenRouter'] },\n      { label: 'Quantum Computing & QNLP', chips: ['Qiskit', 'lambeq', 'PennyLane', 'DisCoPy', 'IQP ansatz', 'Quantum Algorithms'] },\n      { label: 'ML Engineering', chips: ['PyTorch', 'TensorFlow', 'Keras', 'scikit-learn', 'pandas', 'evaluation harness design', 'dataset curation'] },\n      { label: 'MLOps & Infrastructure', chips: ['Docker', 'FastAPI', 'Uvicorn', 'Nginx', 'AWS EC2', 'AWS S3', 'GitHub Actions CI/CD', 'GHCR', 'IAM roles', 'Git LFS'] },\n      { label: 'Frontend & AEM', chips: ['Adobe Experience Manager', 'HTML', 'CSS', 'JavaScript', 'AEM Clientlibs'] },\n      { label: 'Automation & Testing', chips: ['Selenium', 'Cucumber', 'Java', 'PyTest', 'TestNG', 'RestAssured', 'Postman', 'JMeter', 'Blackduck', 'Checkmarx'] }\n    ];\n  }\n\n  get experienceList() {\n    return [\n      {\n        role: 'Research Intern', company: 'CDAC Kolkata', period: 'Sept 2025 to Feb 2026',\n        bullets: [\n          'Designed and built an original hybrid quantum-classical model (quantum circuits with lambeq and PennyLane, plus a classical LSTM) for text emotion classification, and checked that gradients flowed back to the quantum parameters. Tested it across 4 datasets and 2 quantum backends. See the project above for detail.',\n          'Worked on a pipeline that converts DWG AutoCAD geometry into a graph, including feature extraction for the node and edge attributes needed by a Graph Neural Network.',\n          'Co-authored a survey paper, \"A Survey of Quantum Natural Language Processing, From Foundations to Near Term Applications\", accepted for poster presentation at an IEEE conference at IIT Patna.',\n          'Worked with mentors and other teams to benchmark datasets and check research results.'\n        ]\n      },\n      {\n        role: 'Senior Software Engineer', company: 'Dell Technologies', period: 'Apr 2023 to Mar 2025',\n        bullets: [\n          'Acted as security champion for the team. Ran vulnerability scans with Blackduck and Checkmarx, coordinated the fixes, and cleared over 91 percent of the issues found.',\n          'Tested and validated an NLP chatbot and FAQ recommender proof of concept built for AEM forms, checking answer accuracy and conversation flow.',\n          'Mentored junior engineers on automation and security basics.'\n        ]\n      },\n      {\n        role: 'Software Engineer 2', company: 'Dell Technologies', period: 'Jul 2021 to Apr 2023',\n        bullets: [\n          'Worked on AEM front end updates (HTML, CSS, JavaScript, Clientlibs), including template and component changes and accessibility fixes.',\n          'Contributed to backend services on a microservices and Spring Boot project.',\n          'Maintained and extended Python and Selenium test automation used in CI/CD.'\n        ]\n      },\n      {\n        role: 'Software Engineer 1', company: 'Dell Technologies', period: 'Oct 2018 to Jul 2021',\n        bullets: [\n          'Built automated test suites with Selenium, Cucumber and Java, wired into GitLab CI/CD, which cut down manual testing.',\n          'Tested an ML based lead routing system end to end in 2020. This later gave me the idea for the personal rebuild in my projects above.',\n          'Ran API test automation with Postman and RestAssured, and maintained GitLab CI/CD pipelines.',\n          'Coordinated defect triage across teams and worked as SDET for AEM front end testing on several applications.'\n        ]\n      },\n      {\n        role: 'Associate Software Engineer', company: 'Accenture', period: 'May 2017 to Oct 2018',\n        bullets: [\n          'Ran manual and automated testing in Agile and Scrum teams to find defects early.',\n          'Helped write test strategies and test plans, supported CI setups, and reported results to stakeholders.'\n        ]\n      }\n    ];\n  }\n\n  get educationList() {\n    return [\n      { title: 'B.Tech, Electrical Engineering', meta: 'KIIT University, Bhubaneswar · 2017' },\n      { title: 'Chartered Engineer & Associate Member (AMIE)', meta: 'Institution of Engineers (India) · 2018' }\n    ];\n  }\n\n  get certificationsList() {\n    return [\n      { name: 'Joint AI & Quantum Computing (Pursuing)', meta: 'IISc Bangalore & QpiAI' },\n      { name: 'Certificate Course in AI/ML', meta: 'CDAC Kolkata · Aug 2025' },\n      { name: 'Quantum Computing & Programming (QBronze)', meta: 'QWorld · May 2025' },\n      { name: 'Quantum Computing', meta: 'C-DAC & IIT Roorkee · May 2025' },\n      { name: 'Basics of Quantum Information', meta: 'IBM · Apr 2025' },\n      { name: 'Quantum Business Foundations', meta: 'IBM · Mar 2025' },\n      { name: 'Certified Ethical Hacker (CEH)', meta: 'EC-Council · Jan 2015' },\n      { name: 'CCNA', meta: 'Indian School of Ethical Hacking · Aug 2015' }\n    ];\n  }\n\n  get themes() {\n    return {\n      light: {\n        bg: 'oklch(0.972 0.004 250)', panel: 'oklch(0.99 0.003 250)',\n        text: 'oklch(0.2 0.006 260)', body: 'oklch(0.3 0.006 260)',\n        muted2: 'oklch(0.48 0.02 260)', border: 'oklch(0.88 0.008 260)',\n        borderSoft: 'oklch(0.9 0.006 260)', chipBg: 'oklch(0.94 0.006 260)',\n        chipText: 'oklch(0.3 0.006 260)', btnBg: 'oklch(0.2 0.006 260)',\n        btnText: 'oklch(0.95 0.01 200)', projText: 'oklch(0.5 0.01 260)'\n      },\n      dark: {\n        bg: 'oklch(0.17 0.012 260)', panel: 'oklch(0.215 0.014 260)',\n        text: 'oklch(0.95
